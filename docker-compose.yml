services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-feap}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feap}"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-feap}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-feap}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MODEL_LIGHT: ${MODEL_LIGHT:-}
      MODEL_MEDIUM: ${MODEL_MEDIUM:-}
      MODEL_HEAVY: ${MODEL_HEAVY:-}
      LEVEL0_MODEL: ${LEVEL0_MODEL:-}
      LEVEL1_MODEL: ${LEVEL1_MODEL:-}
      LEVEL2_MODEL: ${LEVEL2_MODEL:-}
      LEVEL3_MODEL: ${LEVEL3_MODEL:-}
      LEVEL4_MODEL: ${LEVEL4_MODEL:-}
      LEVEL5_MODEL: ${LEVEL5_MODEL:-}
      LEVEL99_MODEL: ${LEVEL99_MODEL:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    ports:
      - "${APP_PORT:-8000}:8000"

  migrate:
    build: .
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-feap}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-feap}
    command: ["alembic", "upgrade", "head"]

  seed:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-feap}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-feap}
    command: >
      sh -c "
        python scripts/parse_excel.py &&
        python scripts/build_tree.py &&
        python scripts/parse_opi.py &&
        python scripts/parse_units.py &&
        python scripts/seed_db.py &&
        python scripts/seed_vat_exemptions.py &&
        python scripts/seed_excise_rates.py
      "
    profiles:
      - seed

volumes:
  pgdata:
