services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-feap}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feap}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: &app_env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-feap}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-feap}
      REDIS_URL: redis://redis:6379/0
      JOBS_BACKEND: ${JOBS_BACKEND:-arq}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MODEL_LIGHT: ${MODEL_LIGHT:-}
      MODEL_MEDIUM: ${MODEL_MEDIUM:-}
      MODEL_HEAVY: ${MODEL_HEAVY:-}
      LEVEL0_MODEL: ${LEVEL0_MODEL:-}
      LEVEL1_MODEL: ${LEVEL1_MODEL:-}
      LEVEL2_MODEL: ${LEVEL2_MODEL:-}
      LEVEL3_MODEL: ${LEVEL3_MODEL:-}
      LEVEL4_MODEL: ${LEVEL4_MODEL:-}
      LEVEL5_MODEL: ${LEVEL5_MODEL:-}
      LEVEL99_MODEL: ${LEVEL99_MODEL:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      LLM_MAX_CONCURRENT: ${LLM_MAX_CONCURRENT:-8}
      LLM_RATE_LIMIT_PER_MIN: ${LLM_RATE_LIMIT_PER_MIN:-0}
      LLM_RATE_LIMITER_BACKEND: ${LLM_RATE_LIMITER_BACKEND:-local}
      WORKER_MAX_JOBS: ${WORKER_MAX_JOBS:-16}
      WORKER_JOB_TIMEOUT_S: ${WORKER_JOB_TIMEOUT_S:-3600}
      BATCH_SYNC_MAX: ${BATCH_SYNC_MAX:-5}
      BATCH_ASYNC_MAX_ITEMS: ${BATCH_ASYNC_MAX_ITEMS:-200}
      JOB_RESULT_TTL_HOURS: ${JOB_RESULT_TTL_HOURS:-72}
      JOB_EVENTS_RETENTION_HOURS: ${JOB_EVENTS_RETENTION_HOURS:-24}
      STUCK_ITEMS_RESET_AFTER_S: ${STUCK_ITEMS_RESET_AFTER_S:-900}
      SSE_HEARTBEAT_S: ${SSE_HEARTBEAT_S:-15}
      OCR_PROVIDER_URL: ${OCR_PROVIDER_URL:-http://192.168.250.44:8088/ocr/process}
      OCR_PROVIDER_TIMEOUT_S: ${OCR_PROVIDER_TIMEOUT_S:-300}
      OCR_MAX_FILE_MB: ${OCR_MAX_FILE_MB:-25}
      OCR_MAX_FILES_PER_JOB: ${OCR_MAX_FILES_PER_JOB:-10}
      OCR_RESULT_TTL_HOURS: ${OCR_RESULT_TTL_HOURS:-72}
      OCR_UPLOAD_DIR: /app/data/ocr_uploads
      OCR_ALLOWED_MIME: ${OCR_ALLOWED_MIME:-application/pdf,image/jpeg,image/png,image/tiff,image/webp}
      LEVEL98_MODEL: ${LEVEL98_MODEL:-}
    volumes:
      - ocr_uploads:/app/data/ocr_uploads
    ports:
      - "${APP_PORT:-8000}:8000"

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *app_env
    volumes:
      - ocr_uploads:/app/data/ocr_uploads
    command: ["arq", "feap.jobs.worker.WorkerSettings"]
    deploy:
      replicas: ${WORKER_REPLICAS:-2}

  migrate:
    build: .
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-feap}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-feap}
    command: ["alembic", "upgrade", "head"]

  seed:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-feap}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-feap}
    command: >
      sh -c "
        python scripts/parse/excel.py &&
        python scripts/build/tree.py &&
        python scripts/parse/opi.py &&
        python scripts/parse/units.py &&
        python scripts/seed/db.py &&
        python scripts/seed/vat_exemptions.py &&
        python scripts/seed/excise_rates.py
      "
    profiles:
      - seed

volumes:
  pgdata:
  redisdata:
  ocr_uploads:
