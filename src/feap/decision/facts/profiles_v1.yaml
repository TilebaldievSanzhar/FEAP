# Профили групп ТН ВЭД для движка фактов, версия profiles-1 (к банку facts-1).
#
# Для каждой группы — какие варианты ответов банка с ней совместимы. Это «скомпилированный тариф»:
# составлено один раз (Claude Opus 5.5, 6 ноября 2026) по наименованиям и примечаниям групп и
# общим правилам ТН ВЭД, до сбора ответов моделей и без опоры на кейсы оценки пилота.
#
# Правила чтения:
# - вопрос не указан → ограничения нет;
# - условный вопрос банка (с полем absent: food_base, food_preparation, chemical_form, textile_form,
#   metal_form, vehicle_kind) не указан → допустим только вариант absent («не относится»);
# - any → ограничения нет, в том числе для условного вопроса;
# - unknown совместим с любой группой и в списки не пишется.
# Профили нарочно широкие: они отсекают несовместимое, а различать близкие группы помогает
# маршрутизатор, обученный на реестре.
