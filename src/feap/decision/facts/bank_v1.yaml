# Банк вопросов о фактах товара, версия facts-1 (пилот движка фактов, docs/decision_facts_engine.md).
#
# Decision-модель отвечает на каждый вопрос выбором одного варианта; распределение по вариантам
# сохраняется. Вопросы — о товаре, а не о тарифе: модель не толкует ТН ВЭД. Связь фактов с
# группами — в profiles_v1.yaml (составлено один раз) и в маршрутизаторе, обученном на реестре.
#
# Поля вопроса:
#   id, text      — ключ и формулировка;
#   options       — закрытые варианты: ключ → определение, видимое модели; у каждого вопроса есть unknown;
#   absent        — только у условных вопросов («если товар — продукт питания…»): вариант
#                   «не относится», который профиль группы подразумевает, если не указано иное.
version: facts-1
instructions: >-
  Ответь на вопрос о товаре из описания в state. Можно опираться на общеизвестные свойства
  названного товара: например, легковой автомобиль приводится двигателем, а сыр — молочный продукт.
  Не додумывай то, что нельзя установить ни из описания, ни из общеизвестных свойств такого товара:
  тогда выбери unknown. Если в описании несколько товаров, отвечай про основной.
questions:
  - id: kind
    text: Что это за товар по своей природе?
    options:
      live: Живые животные или живые растения, луковицы, черенки, мицелий
      animal_product: >-
        Продукт животного происхождения без сложной переработки: мясо, рыба, морепродукты, молоко и
        молочные продукты, яйца, мёд, кишки, кости, перо, волос
      plant_product: >-
        Продукт растительного происхождения без сложной переработки: овощи, фрукты, орехи, зерно, семена,
        кофе, чай, пряности, мука, крупа, крахмал, солод, лекарственные растения, растительные соки и смолы
      fat_oil: Жиры и масла животного или растительного происхождения, воски растительные и животные
      food_preparation: >-
        Готовый пищевой продукт: колбасы и консервы из мяса или рыбы, сахар и кондитерские изделия,
        какао и шоколад, хлеб, выпечка, макароны, хлопья, детское питание, переработанные овощи и фрукты,
        соки, джемы, соусы, супы, пищевые смеси и добавки
      beverage_tobacco: Напитки (вода, пиво, вино, крепкий алкоголь), спирт, уксус, табак и никотинсодержащие изделия
      feed: Корм для животных, остатки и отходы пищевой промышленности (жмых, отруби, барда)
      mineral_fuel: >-
        Минеральный продукт: соль, сера, песок, глина, камень необработанный, цемент, известь, руды,
        шлак, уголь, нефть и нефтепродукты, топливо, смазочные масла, газ
      chemical: >-
        Продукт химической промышленности: химические вещества, лекарства, удобрения, краски и лаки,
        косметика и парфюмерия, мыло и моющие средства, клеи, ферменты, взрывчатка, фотоматериалы,
        средства защиты растений, реактивы
      plastic_rubber: Пластмассы, каучук, резина и изделия из них
      leather_fur: Шкуры, кожа, мех и изделия из них, сумки, чемоданы, шорно-седельные изделия
      wood: Древесина, древесные плиты, изделия из дерева, пробка, плетёные изделия
      paper: Целлюлоза, бумага, картон, изделия из них, книги, печатная продукция
      textile: >-
        Текстиль: волокна, пряжа, нити, ткани, трикотажное полотно, нетканые материалы, одежда,
        бельё, ковры, текстильные изделия
      footwear_headgear: Обувь, головные уборы, зонты, трости, изделия из перьев, искусственные цветы, парики
      stone_ceramic_glass: Изделия из камня, гипса, цемента, бетона, асбеста, слюды, керамики, фарфора, стекла
      precious: Жемчуг, драгоценные камни, драгоценные металлы, ювелирные изделия, бижутерия, монеты
      base_metal: >-
        Недрагоценный металл или изделие из него, не являющееся машиной или прибором: слитки, прокат,
        трубы, конструкции, ёмкости, крепёж, цепи, пружины, инструменты, замки, фурнитура
      machine_electrical: >-
        Машина, механизм, оборудование, компьютер, бытовой прибор, электрическая машина, электроника,
        аппаратура связи, звука и изображения, электротехнические изделия, их части
      vehicle: Транспортное средство (автомобиль, трактор, мотоцикл, вагон, самолёт, судно), его часть или принадлежность
      instrument: >-
        Прибор или инструмент: оптический, фотографический, измерительный, контрольный, лабораторный,
        медицинский; часы; музыкальный инструмент
      arms: Оружие, боеприпасы и их части
      misc_article: >-
        Мебель, матрасы, светильники, сборные строения, игрушки, игры, спортивный инвентарь, щётки,
        ручки, зажигалки, подгузники, прочие готовые изделия
      art: Произведения искусства, предметы коллекционирования, антиквариат
      unknown: Нельзя определить по описанию

  - id: material
    text: Из какого материала или вещества в основном состоит товар?
    options:
      animal: Животного происхождения (мясо, рыба, молоко, кость, шерсть, шёлк, натуральная кожа, мех, перо)
      plant: Растительного происхождения (зерно, плоды, овощи, хлопок, лён, растительные волокна и масла)
      mineral: Минерал или камень (песок, глина, соль, руда, цемент, гипс, мрамор, гранит)
      petroleum: Нефть, нефтепродукты, уголь, природный газ
      chemical: Химическое вещество или смесь химических веществ
      plastic: Пластмасса, полимер, синтетическая смола, синтетическое волокно
      rubber: Резина или каучук
      wood: Древесина, бамбук, пробка, ротанг
      paper: Бумага, картон, целлюлоза
      textile: Текстильный материал (ткань, трикотаж, войлок, нетканый материал, нити)
      ceramic_glass: Керамика, фарфор, стекло
      precious_metal: Драгоценный металл
      ferrous: Чёрный металл (железо, сталь, нержавеющая сталь, чугун)
      copper: Медь или её сплавы (латунь, бронза)
      aluminium: Алюминий или его сплавы
      other_metal: Другой недрагоценный металл (никель, свинец, цинк, олово, титан, вольфрам и др.)
      multiple: Сложное изделие из разных материалов (машина, прибор, электроника) или ни один материал не преобладает
      unknown: Нельзя определить по описанию

  - id: state
    text: В каком физическом виде товар?
    options:
      living: Живой организм
      article: Изделие определённой формы (предмет, деталь, устройство, одежда)
      sheet_profile: Материал в виде листов, плит, плёнки, лент, профилей, прутков, труб, проволоки, нитей, ткани, рулонов
      solid: Твёрдое вещество или продукт без формы изделия (куски, гранулы, порошок, зерно, мясо, рыба, сыр, плоды)
      liquid: Жидкость
      paste: Паста, гель, крем, мазь, эмульсия, суспензия
      gas: Газ, в том числе сжиженный или сжатый
      unknown: Нельзя определить по описанию

  - id: processing
    text: Какова степень обработки товара?
    options:
      natural: >-
        В естественном виде или после простейшей обработки: очистка, сортировка, охлаждение,
        замораживание, сушка
      primary: >-
        Первичная переработка одного вида сырья без смешивания с другими компонентами: разделка,
        измельчение, помол, дробление, соление, копчение, варка, рафинирование, выплавка
      compound: Продукт сложной переработки или смесь нескольких компонентов (готовые продукты питания, препараты, составы)
      material: Промышленный материал или полуфабрикат для дальнейшего производства (листы, ткани, нити, профили, гранулы)
      finished: Готовое изделие для использования по назначению
      waste: Отходы, лом, остатки производства, изношенные изделия для переработки
      unknown: Нельзя определить по описанию

  - id: completeness
    text: Это целое изделие, часть или не изделие вовсе?
    options:
      complete: Готовое целое изделие (в том числе в разобранном или некомплектном виде, если у него есть основные свойства готового)
      part_specific: Часть, предназначенная для определённой машины, прибора, транспортного средства или изделия
      part_general: >-
        Изделие общего назначения, используемое как деталь: крепёж, пружины, цепи, трубы и фитинги,
        шланги, ремни, провода, уплотнители
      accessory: Принадлежность или расходный материал к другому изделию (картриджи, фильтры, насадки, чехлы)
      set: Набор разных изделий в одной упаковке для розничной продажи
      not_article: Не изделие (вещество, материал, продукт питания, сырьё, живой организм)
      unknown: Нельзя определить по описанию

  - id: function
    text: Для чего в основном предназначен товар?
    options:
      food: Питание людей (продукты питания, напитки)
      feed: Корм для животных
      agriculture: Растениеводство и животноводство (семена, посадочный материал, удобрения, средства защиты растений)
      medicine: Лечение, профилактика, медицинская диагностика, уход за больными, ветеринария
      hygiene_care: Косметика, парфюмерия, гигиена, уход за телом, стирка и уборка
      clothing: Одежда, обувь, головные уборы, аксессуары для ношения
      household: Домашний обиход и интерьер (посуда, мебель, бытовые предметы, текстиль для дома)
      construction: Строительство и отделка (конструкции, стройматериалы, санитарно-техническое оборудование)
      raw_material: Сырьё или материал для промышленного производства
      processing: Обработка, производство, переработка материалов и продуктов (станки, промышленное оборудование)
      fluids: Перекачивание, сжатие, перемещение, распределение, фильтрация жидкостей и газов (насосы, компрессоры, вентиляторы, краны и клапаны)
      thermal: Нагрев, охлаждение, кондиционирование, сушка
      handling: Подъём, погрузка, перемещение грузов (краны, погрузчики, конвейеры, тали)
      transport: Перевозка людей или грузов
      power: Производство, преобразование, накопление, передача электроэнергии; двигатели
      information: Вычисления, обработка, хранение и передача информации, связь, звук, изображение
      lighting: Освещение, световая сигнализация
      measurement: Измерение, контроль, анализ, наблюдение, оптика, навигация, отсчёт времени
      fastening: Крепление, соединение, запирание
      packaging: Упаковка, хранение, перевозка товаров (тара, мешки, бутылки, контейнеры)
      protection: Защита людей и имущества (защитная одежда и снаряжение, сейфы, ограждения, сигнализация)
      leisure: Игры, игрушки, спорт, развлечения, музыка
      decoration: Украшение, искусство, коллекционирование
      weapon: Оружие и боеприпасы
      fuel: Топливо, горючее, смазка
      other: Другое назначение
      unknown: Нельзя определить по описанию

  - id: drive
    text: Чем приводится в действие или от чего работает товар?
    options:
      mains: Электричество от сети
      battery: Аккумулятор или батарейки
      engine: Двигатель внутреннего сгорания (бензин, дизель, газ)
      manual: Вручную, мускульной силой
      fluid_power: Гидравлика, пневматика, пар, давление жидкости или газа
      other: Другой источник (ветер, вода, солнце, пружина, передача от другой машины)
      none: Ничем — товар не устройство и не требует источника энергии (деталь, ёмкость, материал, продукт, одежда)
      unknown: Нельзя определить по описанию

  - id: principle
    text: На каком принципе основано действие товара?
    options:
      mechanical: Механический — движущиеся части, механизм совершает работу
      electric: Электрический — электродвигатель, электронагрев, электромагнит, преобразование электроэнергии
      electronic: Электронный — схемы, микропроцессоры, обработка сигналов и данных
      optical: Оптический — линзы, зеркала, лазер, оптоволокно
      chemical: Химический или биологический — действует само вещество
      passive: Пассивный — товар ничего не делает сам (материал, деталь, ёмкость, одежда, продукт питания)
      unknown: Нельзя определить по описанию

  - id: user
    text: Кто основной пользователь товара или где он применяется?
    options:
      household: Дом и личное пользование
      industrial: Промышленность, профессиональное применение
      agricultural: Сельское, лесное или рыбное хозяйство
      medical: Медицина или ветеринария
      children: Дети
      vehicle: Транспортное средство (как его часть или принадлежность)
      construction: Строительство
      office_retail: Офис, торговля, общественное питание
      universal: Разные пользователи, назначение не ограничено
      unknown: Нельзя определить по описанию

  - id: packaging
    text: Как поставляется товар?
    options:
      retail: В упаковке для розничной продажи потребителю (расфасован в небольшие упаковки)
      bulk: Наливом, навалом или в крупной транспортной таре (мешки, бочки, контейнеры, цистерны)
      piece: Штучное изделие, вид упаковки значения не имеет
      unknown: Нельзя определить по описанию

  - id: food_base
    text: Если товар — продукт питания, напиток или корм, какова его основа?
    absent: not_food
    options:
      meat: Мясо, субпродукты
      fish: Рыба, ракообразные, моллюски
      dairy: Молоко и молочные продукты (сыр, творог, масло, йогурт, сливки, сыворотка)
      eggs_honey: Яйца или мёд
      cereal: Зерно, мука, крупа, крахмал, солод
      fruit_veg: Овощи, фрукты, ягоды, орехи, грибы, бобовые
      sugar: Сахар, патока, сиропы
      cocoa: Какао или шоколад
      fat: Жиры и масла
      coffee_tea_spice: Кофе, чай, пряности
      water: Вода, в том числе с добавками
      alcohol: Алкогольный напиток или спирт
      mixed: Смесь, ни одна основа не преобладает
      not_food: Товар — не продукт питания, не напиток и не корм
      unknown: Нельзя определить по описанию

  - id: food_preparation
    text: Если товар — продукт питания или напиток, насколько он приготовлен?
    absent: not_food
    options:
      natural: Натуральный продукт без добавок (свежий, охлаждённый, мороженый, сушёный, нарезанный, молотый)
      preserved: Сохранён простым способом без других компонентов (солёный, копчёный, вяленый, в рассоле, пастеризованный)
      with_additions: С добавками (сахар, подсластители, вкусовые добавки, ароматизаторы, фрукты, злаки, какао, витамины)
      ready_meal: Готовое блюдо, кулинарное изделие, выпечка, консервы, смесь для приготовления
      not_food: Товар — не продукт питания и не напиток
      unknown: Нельзя определить по описанию

  - id: chemical_form
    text: Если товар — химический продукт, что он собой представляет?
    absent: not_chemical
    options:
      compound: Отдельный химический элемент или соединение определённого состава (в том числе в водном растворе)
      mixture: Смесь, препарат, состав из нескольких веществ
      natural_extract: Природный продукт (эфирное масло, экстракт, смола, природный минерал)
      not_chemical: Товар — не химический продукт
      unknown: Нельзя определить по описанию

  - id: textile_form
    text: Если товар текстильный, в каком он виде?
    absent: not_textile
    options:
      fibre: Волокно, очёсы, угары
      yarn: Пряжа, нити
      woven: Тканая ткань
      knitted: Трикотажное полотно
      nonwoven: Нетканый материал, войлок, вата
      garment_knitted: Трикотажная одежда или её принадлежности
      garment_woven: Одежда из ткани (не трикотажная) или её принадлежности
      home_textile: Бельё постельное, столовое, туалетное, кухонное, шторы
      carpet: Ковры и текстильные напольные покрытия
      technical: Технические текстильные изделия (канаты, сети, ленты, мешки, брезент, палатки, фильтровальные ткани)
      not_textile: Товар — не текстильный
      unknown: Нельзя определить по описанию

  - id: metal_form
    text: Если товар из недрагоценного металла, в каком он виде?
    absent: not_metal
    options:
      unwrought: Необработанный металл, слитки, гранулы, порошок, лом
      semi: Прокат (листы, полосы, прутки, профили, проволока)
      tube: Трубы, трубки, фитинги
      structure: Металлоконструкции, ёмкости, резервуары, баллоны
      fastener_chain: Крепёж, цепи, пружины, гвозди, сетки, тросы
      tool_cutlery: Инструменты, ножи, столовые приборы, ножницы
      household_ware: Посуда, бытовые и санитарно-технические изделия
      hardware: Замки, фурнитура, арматура, таблички, прочие изделия
      device: Металл — лишь материал машины, прибора или устройства
      not_metal: Товар — не из недрагоценного металла
      unknown: Нельзя определить по описанию

  - id: vehicle_kind
    text: Если товар — транспортное средство или предназначен для него, то для какого?
    absent: not_vehicle
    options:
      rail: Железнодорожное или трамвайное
      car: Легковой автомобиль
      truck_bus: Грузовой автомобиль, автобус, специальный автомобиль
      tractor: Трактор или тягач
      two_wheel: Мотоцикл, мопед, велосипед, самокат
      trailer: Прицеп или полуприцеп
      aircraft: Летательный аппарат, дрон, космический аппарат
      vessel: Судно, лодка, плавучее средство
      other_vehicle: Прочее (коляска, тележка, инвалидное кресло)
      not_vehicle: Товар — не транспорт и не для транспорта
